<title id="title">AI SDLC Orchestrator — implemented workflow</title>
<desc id="desc">Discovery, Business Refinement and Functional Analysis feed independent Engineering and QA tracks. Human decisions are separate from AI preparation. QA completion supplies evidence to Engineering verification; Security and Final Verification follow. Both tracks end at Verified, not Released.</desc>
